<svg width="240" height="90" viewBox="0 0 240 90" xmlns="http://www.w3.org/2000/svg">
  <rect x="1" y="1" width="238" height="88" rx="16" fill="#0d1117" stroke="#30363d" stroke-width="1"/>

  <!-- avatar do bot -->
  <circle cx="20" cy="45" r="11" fill="#161b22" stroke="#8892B0" stroke-width="1.4"/>
  <circle cx="16" cy="43" r="1.6" fill="#8892B0"/>
  <circle cx="24" cy="43" r="1.6" fill="#8892B0"/>
  <path d="M14 49 q6 4 12 0" stroke="#8892B0" stroke-width="1.4" fill="none" stroke-linecap="round"/>

  <!-- mensagem do usuário (aparece primeiro) -->
  <g>
    <rect x="42" y="14" width="86" height="24" rx="12" fill="#21262d"/>
    <circle cx="62" cy="26" r="2" fill="#c9d1d9"/>
    <circle cx="72" cy="26" r="2" fill="#c9d1d9"/>
    <circle cx="82" cy="26" r="2" fill="#c9d1d9"/>
    <circle cx="92" cy="26" r="2" fill="#c9d1d9"/>
    <animate attributeName="opacity" values="0;0;1;1;1;0" keyTimes="0;0.02;0.1;0.82;0.9;1" dur="4.4s" repeatCount="indefinite"/>
    <animateTransform attributeName="transform" type="translate" values="0,6;0,6;0,0" keyTimes="0;0.02;0.12" dur="4.4s" repeatCount="indefinite" additive="sum"/>
  </g>

  <!-- indicador de "digitando" do bot -->
  <g>
    <rect x="132" y="50" width="62" height="24" rx="12" fill="#161b22" stroke="#30363d"/>
    <circle cx="150" cy="62" r="3" fill="#8892B0">
      <animate attributeName="cy" values="62;57;62" dur="0.6s" begin="0s" repeatCount="indefinite"/>
    </circle>
    <circle cx="163" cy="62" r="3" fill="#8892B0">
      <animate attributeName="cy" values="62;57;62" dur="0.6s" begin="0.15s" repeatCount="indefinite"/>
    </circle>
    <circle cx="176" cy="62" r="3" fill="#8892B0">
      <animate attributeName="cy" values="62;57;62" dur="0.6s" begin="0.3s" repeatCount="indefinite"/>
    </circle>
    <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.14;0.2;0.42;0.48;1" dur="4.4s" repeatCount="indefinite"/>
  </g>

  <!-- resposta do bot (substitui os pontinhos) -->
  <g>
    <rect x="122" y="50" width="96" height="24" rx="12" fill="#30363d"/>
    <circle cx="144" cy="62" r="2" fill="#c9d1d9"/>
    <circle cx="154" cy="62" r="2" fill="#c9d1d9"/>
    <circle cx="164" cy="62" r="2" fill="#c9d1d9"/>
    <circle cx="174" cy="62" r="2" fill="#c9d1d9"/>
    <circle cx="184" cy="62" r="2" fill="#c9d1d9"/>
    <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.48;0.54;0.82;0.88" dur="4.4s" repeatCount="indefinite"/>
    <animateTransform attributeName="transform" type="translate" values="0,6;0,6;0,0" keyTimes="0;0.48;0.58" dur="4.4s" repeatCount="indefinite" additive="sum"/>
  </g>
</svg>
